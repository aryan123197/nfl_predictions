# Automated Data & Prediction Pipeline (Phase 6 / Design Doc Section 29-30)
#
# Runs on schedule during the NFL season:
# - Wednesdays 14:00 UTC (10:00 AM ET): Midweek injury & odds updates
# - Fridays 14:00 UTC (10:00 AM ET): Late-week practice report updates & weekend lines
# - Sundays 14:00 UTC (10:00 AM ET): Final pre-kickoff predictions & status sync
# - Tuesdays 05:00 UTC (1:00 AM ET): Pulls final scores for the ENTIRE
#   Sunday/Monday slate, including Monday Night Football (kicks off 8:15pm
#   ET Monday, often runs past midnight) -- the Sunday 10am ET run above
#   fires before any Sunday game has even kicked off, so it can never see
#   that day's own results. This run is what actually closes the loop on a
#   week's worth of finals so predictions/health reflect real outcomes; it
#   also runs an hour before retrain.yml's Tuesday 06:00 UTC run, so the
#   retraining cadence always sees that week's finals already ingested.
#
# Can also be triggered manually on-demand via workflow_dispatch.
name: pipeline

on:
  schedule:
    - cron: "0 14 * * 3,5,0"
    - cron: "0 5 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "NFL Season Year (e.g. 2025)"
        required: false
        type: string
      week:
        description: "NFL Week Number (1-18, optional)"
        required: false
        type: string
      skip_plays:
        description: "Skip Play-by-Play ingestion (faster run)"
        required: false
        type: boolean
        default: false

concurrency:
  group: pipeline-execution
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt

      - name: Run Data Ingestion, Feature Build, and Prediction Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ]; then
            ARGS="$ARGS --season ${{ inputs.season }}"
          fi
          if [ -n "${{ inputs.week }}" ]; then
            ARGS="$ARGS --week ${{ inputs.week }}"
          fi
          if [ "${{ inputs.skip_plays }}" = "true" ]; then
            ARGS="$ARGS --skip-plays"
          fi
          python -m src.pipeline.run_pipeline $ARGS --check-health
