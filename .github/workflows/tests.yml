# Offline test suite -- the PR gate.
#
# Runs only the tests that need no network (`-m "not integration"`), so a
# nflverse outage or a slow 40-80MB play-by-play download can never make a
# PR look broken. The live-data tests still run, on their own schedule --
# see integration.yml for why they're split out rather than skipped.
#
# No services needed: src/db.py defaults DATABASE_URL to a local SQLite
# file, so the whole suite runs with nothing but pip install.
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  # Cancel superseded runs on PRs only. A new push to a PR makes the
  # in-flight run obsolete, so cancelling saves a result nobody will read.
  # On main it would do real damage: merging two PRs in quick succession
  # would cancel the first merge commit's run, leaving a commit on main
  # that was never fully tested -- and post-merge runs are precisely what
  # catch two PRs that pass alone but break together.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches the development environment; 3.12 catches version
        # drift early, which is cheap now and annoying to discover later.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-api.txt too: tests/test_api.py skips itself when
          # FastAPI is absent, so without this the API suite would silently
          # not run in CI and a broken endpoint would still go green.
          pip install -r requirements.txt -r requirements-api.txt

      - name: Run offline tests
        run: pytest -m "not integration" -v

  # The frontend is a separate toolchain, so it gets its own job rather than
  # bolting npm onto the Python matrix -- a Python version bump shouldn't
  # re-run the frontend build, and vice versa.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the
      # lockfile's tree and fails if package.json and the lockfile disagree,
      # so CI can't quietly test a different dependency set than a developer.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Building is a real check, not a formality: tsc alone doesn't catch
      # everything that breaks a production bundle.
      - name: Build
        run: npm run build
