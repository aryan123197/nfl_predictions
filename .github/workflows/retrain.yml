# Automated Weekly ML Retraining & Model Promotion Pipeline (Phase 6 / Design Doc Section 26-29)
#
# Runs weekly on Tuesday mornings at 06:00 UTC (02:00 AM ET), after Monday Night Football
# concludes, to:
# 1. Update final game results & score previous predictions.
# 2. Check Decision #4 retraining cadence (Weeks 1-3 skip retraining to avoid overfitting).
# 3. Train candidate models on cumulative season history.
# 4. Evaluate candidates against the champion via Decision #1 promotion gate.
# 5. Promote candidate if performance metrics improve without exceeding regression tolerances.
#
# Can also be triggered manually on-demand via workflow_dispatch.
name: retrain

on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "NFL Season Year (e.g. 2025)"
        required: false
        type: string
      week:
        description: "Current Week Number (e.g. 6)"
        required: false
        type: string
      force_retrain:
        description: "Force retraining even during Weeks 1-3"
        required: false
        type: boolean
        default: false

concurrency:
  group: model-retraining
  cancel-in-progress: false

jobs:
  run-retraining:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt

      - name: Run Weekly Outcome Evaluation & Model Retraining
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ]; then
            ARGS="$ARGS --season ${{ inputs.season }}"
          fi
          if [ -n "${{ inputs.week }}" ]; then
            ARGS="$ARGS --week ${{ inputs.week }}"
          fi
          if [ "${{ inputs.force_retrain }}" = "true" ]; then
            ARGS="$ARGS --force-retrain"
          fi
          python -m src.pipeline.run_retrain $ARGS
